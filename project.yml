name: Seguimiento
options:
  bundleIdPrefix: com.pianattero
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Seguimiento:
    type: application
    platform: iOS
    sources: [Seguimiento]
    entitlements:
      path: Seguimiento/Seguimiento.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Seguimiento/Info.plist
      properties:
        CFBundleDisplayName: Seguimiento
        CFBundleDevelopmentRegion: es
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [healthkit]
        NSHealthShareUsageDescription: "Seguimiento lee tus entrenamientos del Apple Watch, el pulso, las calorías, el peso y el ciclo para calcular tu plan semanal."
        NSHealthUpdateUsageDescription: "Seguimiento no escribe datos en Salud."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pianattero.seguimiento
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  SeguimientoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SeguimientoTests]
    dependencies:
      - target: Seguimiento
schemes:
  Seguimiento:
    build:
      targets:
        Seguimiento: all
    test:
      targets: [SeguimientoTests]
