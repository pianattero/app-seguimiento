name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generar proyecto
        run: |
          brew install xcodegen
          xcodegen

      - name: Compilar y pasar pruebas en el simulador
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone' | grep -oE '[0-9A-F-]{36}')
          echo "Simulador: $UDID"
          xcodebuild test \
            -project Seguimiento.xcodeproj \
            -scheme Seguimiento \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
